server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcpserver.mrad-services.com;

    ssl_certificate     /etc/letsencrypt/live/mrad-services.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrad-services.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Proxies everything, not just /mcp: the OAuth login flow (auth.py) adds
    # /authorize, /token, /register, /login, and /.well-known/* routes that
    # also need to reach the backend.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Streamable HTTP responses can be SSE (text/event-stream) — don't buffer
        proxy_buffering off;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived streaming responses need a generous read timeout
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mcpserver.mrad-services.com;
    return 301 https://$host$request_uri;
}
